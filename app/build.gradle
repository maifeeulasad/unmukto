plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is supplied by the environment (CI) or by a gradle.properties outside
// version control. When nothing is configured the release build simply stays unsigned
// rather than failing, so a plain `assembleRelease` still works for local checks.
def keystorePath = System.getenv('UNMUKTO_KEYSTORE') ?: findProperty('unmukto.keystore')
def hasReleaseSigning = keystorePath != null && file(keystorePath).exists()

android {
    compileSdk 35

    namespace 'com.mua.unmukto'

    defaultConfig {
        applicationId "com.mua.unmukto"
        minSdk 21
        targetSdk 35
        // F-Droid extracts these with a regex and matches them against the git tag it
        // builds from, so they must be literals here -- never computed.
        versionCode 4
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('UNMUKTO_KEYSTORE_PASSWORD') ?: findProperty('unmukto.keystore.password')
                keyAlias System.getenv('UNMUKTO_KEY_ALIAS') ?: findProperty('unmukto.key.alias')
                keyPassword System.getenv('UNMUKTO_KEY_PASSWORD') ?: findProperty('unmukto.key.password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // kotlin-stdlib is contributed by the Kotlin plugin at its own version; declaring it
    // by hand is how the two drift apart.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
